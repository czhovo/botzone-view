function renderOutcome(frame){const out=frame?.outcome,done=frame?.done&&out;$('resultBox').hidden=!done;if(done){$('endReason').textContent=reasonNames[out.reason]||out.reason;$('endWinner').textContent=out.winner===null?'双方平局':`${$('name'+out.winner).textContent} 胜利`;$('endCounts').textContent=`${out.final_counts[0]} : ${out.final_counts[1]}`;}}
function fitBoard(){const b=$('board'),width=$('boardWrap').getBoundingClientRect().width,gap=parseFloat(getComputedStyle(b).columnGap)||0,cell=Math.max(1,Math.floor((width-7*gap)/8)),size=8*cell+7*gap;Object.assign(b.style,{width:`${size}px`,height:`${size}px`,gridTemplateColumns:`repeat(8,${cell}px)`,gridTemplateRows:`repeat(8,${cell}px)`});}
function draw(override){cancelAnimation();fitBoard();drawState(override);const event=override?.event??(index?events[index-1]:null);renderOutcome(event?.frame);$('progressFill').style.width=`${100*index/Math.max(1,events.length)}%`;$('progressLabel').textContent=`当前回合：${event?.frame?.ply??0}`;}
function anim(node,keyframes,options){const a=node.animate(keyframes,options);activeAnimations.push(a);return a;}
function boardAt(i){return i?events[i-1].frame.board:data.replay.header.initial_board;}
function animateAdvance(next){
    next=Math.max(0,Math.min(events.length,next));
    if(!data)return Promise.resolve();
    const old=index,reverse=next<old,before=boardAt(old),record=events[(reverse?old:next)-1]?.frame;
    index=next;draw();
    if(Math.abs(next-old)!==1||!record?.action||record.kind==='pass')return Promise.resolve();
    const after=boardAt(next),m=record.action,epoch=animationEpoch,factor=Number($('speed').value)/1000,stage=document.querySelector('.arena-stage');
    stage.dataset.animating='true';stage.dataset.animationKind=reverse?'reverse-place':'place';$('resultBox').hidden=true;
    const pending=[],target=cells[m.y*8+m.x];
    let disc=target.querySelector('.piece');
    if(reverse){disc=document.createElement('div');disc.className='piece'+(before[m.y][m.x]===-1?' white':'');target.append(disc);}
    if(disc)pending.push(anim(disc,[{transform:reverse?'scale(1)':'scale(0)'},{transform:reverse?'scale(0)':'scale(1)'}],{duration:250*factor,easing:'ease-out',fill:'forwards'}).finished);
    for(const [x,y] of record.converted||[]){
        const node=cells[y*8+x].querySelector('.piece');if(!node)continue;
        const oldColor=before[y][x]===1?'#000':'#fff',newColor=after[y][x]===1?'#000':'#fff';
        node.classList.toggle('white',before[y][x]===-1);node.style.backgroundColor=oldColor;
        const delay=(100+35*Math.max(Math.abs(x-m.x),Math.abs(y-m.y)))*factor;
        pending.push(anim(node,[{transform:'rotateY(0deg)',backgroundColor:oldColor,offset:0},{transform:'rotateY(90deg)',backgroundColor:oldColor,offset:.49},{transform:'rotateY(90deg)',backgroundColor:newColor,offset:.5},{transform:'rotateY(0deg)',backgroundColor:newColor,offset:1}],{delay,duration:600*factor,easing:'ease-in-out',fill:'forwards'}).finished);
    }
    const oldCounts=counts(before);$('count0').textContent=oldCounts[0];$('count1').textContent=oldCounts[1];
    const run=(async()=>{try{
        await Promise.all(pending);if(epoch!==animationEpoch)return;
        // Rebuild from the recorded final board after all flips have settled.
        drawState();renderOutcome(next?events[next-1].frame:null);
    }catch(error){if(epoch===animationEpoch)throw error;}finally{if(epoch===animationEpoch){stage.dataset.animating='false';activeAnimations=[];currentRun=null;}}})();
    currentRun=run;return run;
}
function stop(){playing=false;playEpoch++;if(timer)clearTimeout(timer);timer=null;for(const a of activeAnimations)if(a.playState==='running')a.pause();$('play').textContent='播放';}
function jump(i){stop();index=Math.max(0,Math.min(events.length,i));draw();}
function advance(i){stop();animateAdvance(i).catch(e=>{$('status').textContent=e.message;});}
function play(){
    if(playing){stop();return;}if(index>=events.length){index=0;draw();}playing=true;const epoch=++playEpoch;$('play').textContent='暂停';for(const a of activeAnimations)if(a.playState==='paused')a.play();
    const tick=async()=>{if(!playing||epoch!==playEpoch)return;if(index>=events.length){playing=false;$('play').textContent='播放';return;}
        await animateAdvance(index+1);if(!playing||epoch!==playEpoch)return;if(index>=events.length){playing=false;$('play').textContent='播放';return;}
        timer=setTimeout(tick,400*Number($('speed').value)/1000);
    };
    if(currentRun)currentRun.then(()=>{if(playing&&epoch===playEpoch)timer=setTimeout(tick,400*Number($('speed').value)/1000);});else tick().catch(e=>{stop();$('status').textContent=e.message;});
}
$('detailsToggle').onclick=()=>{const open=document.body.classList.toggle('with-details');$('detailsToggle').setAttribute('aria-expanded',String(open));};$('dismissResult').onclick=()=>{$('resultBox').hidden=true;};
$('play').onclick=play;$('first').onclick=()=>jump(0);$('last').onclick=()=>jump(events.length);$('back').onclick=()=>advance(index-1);$('next').onclick=()=>advance(index+1);$('seek').oninput=()=>jump(Number($('seek').value));$('speed').onchange=()=>{if(playing){stop();play();}};$('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()));}catch(err){$('status').textContent=err.message;$('status').classList.add('error');}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();advance(index+1);}if(e.key==='ArrowLeft'){e.preventDefault();advance(index-1);}if(e.code==='Space'){e.preventDefault();play();}});
window.addEventListener('resize',()=>{if(currentRun)draw();else fitBoard();});
if(embedded){document.body.classList.add('embed');window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='arena-replay-frame'||e.data.header?.game!=='reversi-v1')return;const m=e.data;data={result:m.result,replay:{header:m.header,events:[]}};events=[];index=m.step+1;$('name0').textContent=m.match.seats[0];$('name1').textContent=m.match.seats[1];draw(m);});draw();}else{try{const init=JSON.parse($('reversi-data').textContent);if(init?.samples){choices=init.samples;$('samples').hidden=false;choices.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=d.title;$('samples').append(o);});$('samples').onchange=()=>load(choices[Number($('samples').value)].document);load(choices[0].document);}else if(init)load(init);else draw();}catch(err){$('status').textContent=err.message;$('status').classList.add('error');}}
</script><script>fetch('./matches/'+encodeURIComponent(new URLSearchParams(location.search).get('id'))+'.json').then(r=>{if(!r.ok)throw Error('回放不存在');return r.json()}).then(load).catch(e=>document.getElementById('status').textContent=e.message);</script><p style="text-align:center"><a href="./tournament.html">返回全部对局</a></p></body></html>
